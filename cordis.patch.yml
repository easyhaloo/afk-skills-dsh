# The afk-skills bundle patch: mounts the afk skill set by REFERENCE.
#
# No skill snapshot ships in this package. The row's module maintains a
# shallow clone of the AFK repository in a local cache and mounts an isolated
# skill-filesystem provider scanning the clone's skills/ directory.
#
# Override repo/ref/cacheDir here, or per machine via env:
#   AFK_SKILLS_REPO / AFK_SKILLS_REF / AFK_SKILLS_CACHE_DIR

- insert:
    - id: afk-skills
      name: afk-skills-dsh
      config:
        repo: https://github.com/easyhaloo/afk.git
        ref: main

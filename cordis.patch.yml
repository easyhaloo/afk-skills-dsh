# The afk-skills bundle patch: mounts the bundled AFK skill suite as ONE
# additional skill provider beside the base skill-filesystem row.
#
# The row's module (afk-skills-dsh, this package's main entry) resolves its own
# skills/ directory from import.meta.url and mounts a second instance of
# @deepseek-ai/dsh-skill-filesystem with includeDefaultRoots:false, so this
# provider sees ONLY the packaged afk skills (rank 300 custom roots).

- insert:
    - id: afk-skills
      name: afk-skills-dsh
